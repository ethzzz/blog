name: Code quality

on:
  push:
    branches: [ main ] # Adjust branches as needed
  pull_request:
    branches: [ main ] # Adjust branches as needed

jobs:
  quality:
    runs-on: ubuntu-latest
    # 兜底：稳定约 0.1 分钟（只扫 ./src、无需装依赖）。不设时默认 6 小时。
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Biome
        uses: biomejs/setup-biome@f382a98e582959e6aaac8e5f8b17b31749018780 # v2.5.0
        with:
          # 固定版本，与 package.json 的 @biomejs/biome 保持一致；升级时两处一起改。
          # 用 latest 会让「没改代码的提交」因为新版规则/格式变化突然变红。
          version: 2.2.5
      - name: Run Biome
        run: biome ci ./src --reporter=github

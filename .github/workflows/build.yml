name: Build and Check

on:
  push:
    branches: [ main ] # Adjust branches as needed
  pull_request:
    branches: [ main ] # Adjust branches as needed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        node: [ 22, 23 ]
    runs-on: ubuntu-latest
    # 兜底：历史中位 0.6 分钟、最长 1.1 分钟（含 pnpm install）。不设时默认 6 小时，
    # 卡住会白占 runner，且状态长时间 pending 让人误以为还在跑。
    timeout-minutes: 15
    name: Astro Check for Node.js ${{ matrix.node }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ matrix.node }} # Use LTS

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 内容门禁：frontmatter 引号 / MDX 裸标签与花括号 / 内链有效性 / 模块归属。
      # 放在装依赖之前——纯 node 脚本、秒级返回，而它抓的三类问题会让 `astro build` 直接崩，
      # 等 pnpm install 跑完才发现纯属浪费。
      # 只挂 Check 不挂 deploy.yml：新门禁先别拿生产发布当试验品，观察一阵无误报再升级成部署阻断。
      - name: Content gate
        run: node scripts/check-content.js

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false # Disable auto-install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Astro Check
        run: pnpm astro check

  build:
    strategy:
      matrix:
        node: [ 22, 23 ]
    runs-on: ubuntu-latest
    # 同 check：历史中位 0.9 分钟、最长 1.1 分钟，15 分钟留足缓存未命中的余量。
    timeout-minutes: 15
    name: Astro Build for Node.js ${{ matrix.node }} # Corrected job name
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ matrix.node }}

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false # Disable auto-install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Astro Build
        run: pnpm astro build

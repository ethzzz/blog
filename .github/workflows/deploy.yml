name: Deploy Blog to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一个部署，避免并发覆盖
concurrency:
  group: deploy-blog
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy host secret
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::DEPLOY_HOST secret is missing. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (astro build + pagefind)
        run: npm run build

      - name: Upload dist to server (staging)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "dist/*"
          target: "/tmp/blog-deploy"

      - name: Publish to /var/www/blog and verify
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # scp-action 可能把 dist 内容物放到 /tmp/blog-deploy/dist 或 /tmp/blog-deploy，统一展平
            if [ -d /tmp/blog-deploy/dist ]; then SRC=/tmp/blog-deploy/dist; else SRC=/tmp/blog-deploy; fi
            # 清空旧产物（含隐藏文件），再整体覆盖，避免 stale 文件残留
            find /var/www/blog -mindepth 1 -delete
            cp -r "$SRC/." /var/www/blog/
            chown -R root:www-data /var/www/blog
            chmod -R 755 /var/www/blog
            rm -rf /tmp/blog-deploy
            echo "==> verify HTTP status"
            fail=0
            for p in /blog/ /blog/archive/ /blog/about/ /blog/rss.xml /blog/typescript-roadmap/ /blog/python-roadmap/; do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1$p)
              echo "$p -> $code"
              [ "$code" = "200" ] || fail=1
            done
            if [ $fail -eq 0 ]; then echo "ALL ROUTES OK"; else echo "SOME ROUTES FAILED"; exit 1; fi

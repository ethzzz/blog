name: Deploy Blog to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一个部署，避免并发覆盖
# ⚠️ cancel-in-progress: false 意味着「一个卡住会阻塞后面所有部署」——
#    GitHub runner → 服务器 22 端口的 scp 是间歇性不通的（实测卡在 Upload 那步 8 分钟以上，
#    而服务器 /tmp/blog-deploy 根本没被创建、load 只有 0.05）。
#    真卡住时到 Actions 页面取消，然后用服务器本地部署兜底：
#      ssh myapp 'bash /root/blog-src/ops/deploy-ssr.sh'
concurrency:
  group: deploy-blog
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # ⚠️ 必须设超时：GitHub 默认 job 超时是 **6 小时**，配合上面的 cancel-in-progress: false，
    #    一次真卡住会把后面所有部署排队堵住半天（2026-10-14 实测过这种堵法）。
    # 为什么是 35 而不是 10：**上传步骤本身就慢**。2026-10-16 读 Actions API 逐步骤实测：
    #    成功的运行里 `Upload dist to server` 要 11.5 / 11.7 / 12.8 / 12.8 / 13.1 / 21.6 / 24.9 分钟，
    #    失败那次卡到 25.6 分钟才报错 —— 定 10 分钟会把本来能成的部署全部杀掉。
    #    35 = 已观测最慢成功（24.9）+ 约 40% 余量。真要下调，先回去看那几个数。
    # 另：admin 侧发布已改走服务器本地构建（实测 80 秒），CI 只负责仓库侧提交。
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy host secret
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::DEPLOY_HOST secret is missing. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (astro build + pagefind)
        run: npm run build

      # ⚠️ 这里**不再把 runner 的产物 scp 到服务器**（2026-10-16 改）。
      #
      # 为什么：CI 运行会排队，而上传实测要 11–25 分钟 —— 也就是说「这一版产物」来自十来分钟前的
      # 某个提交。把它复制到服务器，等于把线上**回退**到那一版。这不是理论风险，实测发生过：
      # 一次 CI 发布把 /root/blog-src/dist/server 覆盖成 /home/runner/... 的构建（manifest 里的
      # 路径就是证据），刚上线的 /blog/preview 路由当场消失；同样地，它也会静默盖掉后台刚发布的文章。
      #
      # 现在的分工：runner 上只做「这一版内容能不能构建」的校验（上面那步，快且不碰生产）；
      # 发布统一交给**服务器上的构建脚本** —— 它先 `git pull` 到最新 origin/main 再构建发布，
      # 与后台「发布并部署」走同一条路，因此永远不会发布一个不对应当前提交的产物。
      # 服务器那侧还有 flock（ops/deploy-ssr.sh 开头）把多个触发者排成一队。
      - name: Deploy on server (same build path as the admin backend)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            bash /root/blog-src/ops/deploy-ssr.sh

            echo "==> verify HTTP status (nginx 80 端口无条件 301 到 https，故直连本地 443 校验)"
            fail=0
            for p in /blog/ /blog/archive/ /blog/about/ /blog/rss.xml; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --resolve haolo.cloud:443:127.0.0.1 "https://haolo.cloud$p")
              echo "$p -> $code"
              [ "$code" = "200" ] || fail=1
            done
            # solutions / preview 单独判：它们依赖 nginx 已把前缀反代给 SSR 进程（那是
            # ops/nginx-blog-ssr.sh 的职责，与「发个版」是两件事）。没配好时只警告。
            for p in /blog/solutions/ /blog/preview/00000000000000000000000000000000/; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --resolve haolo.cloud:443:127.0.0.1 "https://haolo.cloud$p")
              echo "$p -> $code"
              # 预览那个用不存在的 token，404 才是对的（说明 SSR 路由在）
              case "$p" in */preview/*) [ "$code" = "404" ] || echo "::warning::$p 不是 404 —— 检查 nginx 反代：bash /root/blog-src/ops/nginx-blog-ssr.sh" ;; esac
              case "$p" in */solutions/) [ "$code" = "200" ] || echo "::warning::$p 不是 200 —— 检查 nginx 反代：bash /root/blog-src/ops/nginx-blog-ssr.sh" ;; esac
            done
            if [ $fail -eq 0 ]; then echo "ALL ROUTES OK"; else echo "SOME ROUTES FAILED"; exit 1; fi

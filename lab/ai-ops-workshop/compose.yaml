services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ops_workshop
      MYSQL_USER: workshop
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-3308}:3306"
    volumes:
      - ops-data:/var/lib/mysql
      - ./init-dev.sql:/docker-entrypoint-initdb.d/10-workshop.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u workshop ops_workshop -e 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  ops-data:
